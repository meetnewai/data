name: Weekly snapshot

on:
  schedule:
    - cron: "17 2 * * 1" # Mondays 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and write snapshot if content changed
        run: python3 scripts/snapshot.py
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- snapshots latest.json)" ]; then
            echo "No content change; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots latest.json
          git commit -m "data: snapshot $(date -u +%F)"
          git push
